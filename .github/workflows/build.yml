name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace -PbuildVersionCode=${{ github.run_number }}

      - name: Rename APK
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"\K[^"]+')
          mkdir -p app/build/outputs/apk/renamed
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/renamed/NewsFeed-v${VERSION}-${{ github.run_number }}.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NewsFeed-v${{ github.run_number }}
          path: app/build/outputs/apk/renamed/*.apk
          retention-days: 30

      - name: Prepare latest-release assets
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p app/build/outputs/apk/release-latest
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/release-latest/NewsFeed-latest.apk
          echo "{\"versionCode\": ${{ github.run_number }}}" > app/build/outputs/apk/release-latest/version.json

      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          body: "Automated rolling build from commit ${{ github.sha }} (CI run ${{ github.run_number }})."
          files: app/build/outputs/apk/release-latest/*
